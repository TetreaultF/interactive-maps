<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Earthquakes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans
  
  wght@200;400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="../../" class="back-button"> ← Back to Interactive Atlas </a>

  <header class="header-section">
    <h1>Where is the Earth shaking right now?</h1>
    <p>Explore Earth's seismic activity over the past 30 days.</p>
  </header>

  <main class="map-section">
    <div class="map-stack">
      <div id="map-wrapper">
        <div id="map-container"></div>

        <div id="zoom-controls">
          <button id="zoom-in" aria-label="Zoom in">+</button>
          <button id="zoom-out" aria-label="Zoom out">−</button>
        </div>

        <div id="legend">
          <span class="legend-title">Magnitude</span>
          <div class="legend-row"><span class="legend-dot" data-mag="1"></span> &lt; 2.5</div>
          <div class="legend-row"><span class="legend-dot" data-mag="2"></span> 2.5 – 4</div>
          <div class="legend-row"><span class="legend-dot" data-mag="3"></span> 4 – 5.5</div>
          <div class="legend-row"><span class="legend-dot" data-mag="4"></span> 5.5+</div>
        </div>

        <div id="status-badge">
          <span id="status-dot"></span>
          <span id="status-text">Loading…</span>
        </div>
      </div>

      <div id="time-panel">
        <div id="time-presets">
          <button class="preset-btn active" data-hours="1">1h</button>
          <button class="preset-btn" data-hours="24">24h</button>
          <button class="preset-btn" data-hours="168">7d</button>
          <button class="preset-btn" data-hours="720">30d</button>
        </div>

        <div id="time-slider-row">
          <span class="slider-edge-label">Now</span>
          <input type="range" id="time-slider" min="1" max="720" value="1" step="1">
          <span class="slider-edge-label">30d</span>
        </div>

        <div id="time-count"><strong id="count-number">0</strong> earthquakes in the last <span id="time-window">30 days</span></div>
      </div>
    </div>
  </main>

  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
